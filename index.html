<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roteirizador</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.2/dist/dexie.min.js"></script>

<style>
body {
  background: #f5f6f8;
  font-size: 14px;
}

.container {
  max-width: 850px;
}

.card {
  border: none;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}

.item-row {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px;
  border-bottom: 1px solid #eee;
}

.item-row input[type="text"] {
  height: 30px;
  font-size: 13px;
}

.item-row .endereco {
  flex: 2;
}

.item-row .produto {
  flex: 1.5;
}

.item-row button {
  height: 30px;
  padding: 0 8px;
  font-size: 12px;
}

.entregue {
  text-decoration: line-through;
  opacity: 0.5;
}

.section-title {
  font-weight: 600;
  margin-bottom: 8px;
}
</style>
</head>
<body>

<div class="container mt-4">

<!-- CADASTRO -->
<div class="card p-3 mb-3">
  <div class="section-title">Cadastro</div>
  <div id="inputs"></div>
  <button id="add" class="btn btn-outline-primary btn-sm mt-2">Adicionar</button>
</div>

<!-- WHATS -->
<div class="card p-3 mb-3">
  <div class="section-title">Entregador</div>
  <div id="whats"></div>
  <button id="addWhats" class="btn btn-outline-primary btn-sm mt-2">Adicionar</button>
</div>

<!-- LISTA -->
<div class="card p-3">
  <div class="d-flex gap-2 mb-2">
    <button id="send" class="btn btn-primary btn-sm">Enviar WhatsApp</button>
    <button id="abrirMapa" class="btn btn-dark btn-sm">Ver rota</button>
  </div>
  <div id="list"></div>
</div>

</div>

<script>

// ================= DB =================

const dbHistorico = new Dexie("RotaHistoricoDB");
dbHistorico.version(2).stores({
  historico: "++id, endereco, produto, prioridade, entregue"
});

const dbWhats = new Dexie("WhatsDB");
dbWhats.version(2).stores({
  numeros: "++id, numero, nome, ativo"
});

// ================= INPUT =================

function addInput(){
  const div = document.createElement("div");
  div.className = "input-group mb-2";

  div.innerHTML = `
    <input class="form-control endereco" placeholder="Endereço">
    <input class="form-control produto" placeholder="Produto">
    <button class="btn btn-outline-success salvar">Salvar</button>
  `;

  div.querySelector(".salvar").onclick = async () => {
    const e = div.querySelector(".endereco").value.trim();
    const p = div.querySelector(".produto").value.trim();
    if (!e) return;

    await dbHistorico.historico.add({
      endereco: e,
      produto: p,
      entregue: false
    });

    div.querySelector(".endereco").value = "";
    div.querySelector(".produto").value = "";

    loadList();
  };

  inputs.appendChild(div);
}

add.onclick = addInput;

// ================= WHATS =================

async function loadWhats(){
  whats.innerHTML = "";

  const lista = await dbWhats.numeros.toArray();

  lista.forEach(n => {
    const row = document.createElement("div");
    row.className = "input-group mb-2";

    row.innerHTML = `
      <div class="input-group-text">
        <input type="radio" ${n.ativo?"checked":""}>
      </div>
      <input class="form-control nome" placeholder="Nome" value="${n.nome||""}">
      <input class="form-control numero" placeholder="Número" value="${n.numero}">
    `;

    row.querySelector("input").onclick = async () => {
      const all = await dbWhats.numeros.toArray();
      for (let i of all) {
        await dbWhats.numeros.update(i.id,{ativo:false});
      }
      await dbWhats.numeros.update(n.id,{ativo:true});
      loadWhats();
    };

    row.querySelector(".nome").onchange = e =>
      dbWhats.numeros.update(n.id,{nome:e.target.value});

    row.querySelector(".numero").onchange = e =>
      dbWhats.numeros.update(n.id,{numero:e.target.value});

    whats.appendChild(row);
  });
}

addWhats.onclick = async () => {
  await dbWhats.numeros.add({numero:"",nome:"",ativo:false});
  loadWhats();
};

// ================= LIST =================

async function loadList(){
  list.innerHTML = "";

  const dados = await dbHistorico.historico.toArray();

  dados.forEach(r => {
    const row = document.createElement("div");
    row.className = "item-row " + (r.entregue?"entregue":"");

    row.innerHTML = `
      <input type="checkbox" class="sel" ${r.entregue?"disabled":""}>
      <input class="form-control endereco" value="${r.endereco}">
      <input class="form-control produto" value="${r.produto||""}">
      <button class="btn btn-outline-primary save">💾</button>
      <button class="btn btn-outline-success ok">✔</button>
      <button class="btn btn-outline-danger del">×</button>
    `;

    // salvar edição
    row.querySelector(".save").onclick = async () => {
      await dbHistorico.historico.update(r.id,{
        endereco: row.querySelector(".endereco").value,
        produto: row.querySelector(".produto").value
      });
    };

    // entregue
    row.querySelector(".ok").onclick = async () => {
      await dbHistorico.historico.update(r.id,{
        entregue: !r.entregue
      });
      loadList();
    };

    // remover
    row.querySelector(".del").onclick = async () => {
      await dbHistorico.historico.delete(r.id);
      loadList();
    };

    list.appendChild(row);
  });
}

// ================= ROTA =================

async function gerarLink(selected){

  let origem;

  try {
    origem = await new Promise((res, rej) => {
      navigator.geolocation.getCurrentPosition(
        p => res(`${p.coords.latitude},${p.coords.longitude}`),
        () => rej()
      );
    });
  } catch {
    origem = selected[0];
  }

  return "https://www.google.com/maps/dir/" +
    [origem, ...selected].map(e=>encodeURIComponent(e)).join("/");
}

// ================= BOTÕES =================

abrirMapa.onclick = async () => {
  const selected = [];

  document.querySelectorAll(".item-row").forEach(r=>{
    const cb = r.querySelector(".sel");
    if(cb.checked && !cb.disabled){
      selected.push(r.querySelector(".endereco").value);
    }
  });

  if(!selected.length) return alert("Selecione itens");

  window.open(await gerarLink(selected));
};

send.onclick = async () => {
  const whatsSel = (await dbWhats.numeros.toArray()).find(w=>w.ativo);
  if(!whatsSel) return alert("Selecione entregador");

  const selected=[], itens=[];

  document.querySelectorAll(".item-row").forEach(r=>{
    const cb = r.querySelector(".sel");
    if(cb.checked && !cb.disabled){
      const e = r.querySelector(".endereco").value;
      const p = r.querySelector(".produto").value;
      selected.push(e);
      itens.push(`${p} - ${e}`);
    }
  });

  if(!selected.length) return alert("Selecione itens");

  const link = await gerarLink(selected);

  const msg = encodeURIComponent(
    `Entregador: ${whatsSel.nome||""}\n\n` +
    itens.join("\n") +
    "\n\nRota:\n" + link
  );

  window.open(`https://wa.me/${whatsSel.numero}?text=${msg}`);
};

// INIT
addInput();
loadWhats();
loadList();

</script>

</body>
</html>
