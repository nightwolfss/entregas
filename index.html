<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roteirizador</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/dexie@3.2.2/dist/dexie.min.js"></script>

<style>
body { background: #f5f6f8; font-size: 14px; }
.container { max-width: 800px; }
.card { border: none; border-radius: 12px; }
.entregue { text-decoration: line-through; opacity: 0.5; }
.section-title { font-weight: 600; margin-bottom: 10px; }
input.form-control { font-size: 13px; }
</style>
</head>
<body>

<div class="container mt-4">

<div class="card p-3 mb-3">
  <div class="section-title">Cadastro</div>
  <div id="inputs"></div>
  <button id="add" class="btn btn-outline-primary btn-sm mt-2">Adicionar</button>
</div>

<div class="card p-3 mb-3">
  <div class="section-title">Entregador</div>
  <div id="whats"></div>
  <button id="addWhats" class="btn btn-outline-primary btn-sm mt-2">Adicionar número</button>
</div>

<div class="card p-3">
  <div class="d-flex justify-content-between">
    <div class="section-title">Entregas</div>
    <button id="send" class="btn btn-primary btn-sm">Enviar</button>
  </div>
  <ul id="list" class="list-group list-group-flush"></ul>
</div>

</div>

<script>

// ================= DB =================

const dbHistorico = new Dexie("RotaHistoricoDB");
dbHistorico.version(2).stores({
  historico: "++id, endereco, produto, prioridade, entregue"
});

const dbWhats = new Dexie("WhatsDB");
dbWhats.version(1).stores({
  numeros: "++id, numero, ativo"
});

// ================= INPUT =================

function addInput(){
  const div=document.createElement("div");
  div.className="input-group mb-2";

  div.innerHTML=`
    <input class="form-control endereco" placeholder="Endereço">
    <input class="form-control produto" placeholder="Produto">
    <button class="btn btn-outline-success salvar">Salvar</button>
    <button class="btn btn-outline-danger remover">×</button>
  `;

  div.querySelector(".salvar").onclick=async()=>{
    const e=div.querySelector(".endereco").value.trim();
    const p=div.querySelector(".produto").value.trim();
    if(!e)return;

    await dbHistorico.historico.add({
      endereco:e,
      produto:p,
      entregue:false
    });

    div.querySelector(".endereco").value="";
    div.querySelector(".produto").value="";

    loadList();
  };

  div.querySelector(".remover").onclick=()=>div.remove();

  document.querySelector("#inputs").appendChild(div);
}

document.querySelector("#add").onclick=addInput;

// ================= WHATS =================

async function loadWhats(){
  const c=document.querySelector("#whats");
  c.innerHTML="";

  const lista=await dbWhats.numeros.toArray();

  lista.forEach(n=>{
    const row=document.createElement("div");
    row.className="input-group mb-2";

    row.innerHTML=`
      <div class="input-group-text">
        <input type="radio" ${n.ativo?"checked":""}>
      </div>
      <input class="form-control numero" value="${n.numero}">
      <button class="btn btn-outline-danger remover">×</button>
    `;

    row.querySelector("input").onclick=async()=>{
      const all=await dbWhats.numeros.toArray();
      for(let i of all){
        await dbWhats.numeros.update(i.id,{ativo:false});
      }
      await dbWhats.numeros.update(n.id,{ativo:true});
      loadWhats();
    };

    row.querySelector(".numero").onchange=async(e)=>{
      await dbWhats.numeros.update(n.id,{numero:e.target.value});
    };

    row.querySelector(".remover").onclick=async()=>{
      await dbWhats.numeros.delete(n.id);
      loadWhats();
    };

    c.appendChild(row);
  });
}

document.querySelector("#addWhats").onclick=async()=>{
  await dbWhats.numeros.add({numero:"",ativo:false});
  loadWhats();
};

// ================= LIST =================

async function loadList(){
  const ul=document.querySelector("#list");
  ul.innerHTML="";

  const dados=await dbHistorico.historico.toArray();

  dados.forEach(r=>{
    const li=document.createElement("li");
    li.className="list-group-item d-flex align-items-center "+(r.entregue?"entregue":"");

    li.innerHTML=`
      <input type="checkbox" class="me-2 sel" ${r.entregue?"disabled":""}>
      
      <div class="flex-grow-1">
        <input class="form-control form-control-sm endereco mb-1" value="${r.endereco}">
        <input class="form-control form-control-sm produto" value="${r.produto || ""}">
      </div>

      <button class="btn btn-outline-primary btn-sm me-1 save">💾</button>
      <button class="btn btn-outline-success btn-sm me-1 ok">✔</button>
      <button class="btn btn-outline-danger btn-sm del">×</button>
    `;

    // salvar edição
    li.querySelector(".save").onclick=async()=>{
      const e=li.querySelector(".endereco").value.trim();
      const p=li.querySelector(".produto").value.trim();

      if(!e) return alert("Endereço obrigatório");

      await dbHistorico.historico.update(r.id,{
        endereco:e,
        produto:p
      });

      loadList();
    };

    // toggle entregue
    li.querySelector(".ok").onclick=async()=>{
      await dbHistorico.historico.update(r.id,{
        entregue:!r.entregue
      });
      loadList();
    };

    // remover
    li.querySelector(".del").onclick=async()=>{
      await dbHistorico.historico.delete(r.id);
      loadList();
    };

    ul.appendChild(li);
  });
}

// ================= GEO =================

function geo(){
  return new Promise((res,rej)=>{
    navigator.geolocation.getCurrentPosition(
      p=>res(`${p.coords.latitude},${p.coords.longitude}`),
      ()=>rej()
    );
  });
}

// ================= ROUTE =================

function pseudo(s){
  let h=0;
  for(let c of s)h=c.charCodeAt(0)+((h<<5)-h);
  return {lat:h%90,lng:h%180};
}

function dist(a,b){
  return Math.hypot(a.lat-b.lat,a.lng-b.lng);
}

function optimize(list,origin){
  let r=[],cur=origin,rest=[...list];
  while(rest.length){
    let i=0,min=Infinity;
    rest.forEach((e,idx)=>{
      let d=dist(pseudo(cur),pseudo(e));
      if(d<min){min=d;i=idx;}
    });
    cur=rest[i];
    r.push(cur);
    rest.splice(i,1);
  }
  return r;
}

// ================= SEND =================

document.querySelector("#send").onclick=async()=>{
  const whats=(await dbWhats.numeros.toArray()).find(w=>w.ativo);
  if(!whats)return alert("Selecione entregador");

  const selected=[],itens=[];

  document.querySelectorAll("#list li").forEach(li=>{
    const checkbox=li.querySelector(".sel");

    if(checkbox.checked && !checkbox.disabled){
      const e=li.querySelector(".endereco").value;
      const p=li.querySelector(".produto").value;

      selected.push(e);
      itens.push(`${p} - ${e}`);
    }
  });

  if(!selected.length)return alert("Selecione itens");

  let origem;
  try{origem=await geo();}catch{return alert("Permita localização");}

  const rota=optimize(selected,origem);

  const link="https://www.google.com/maps/dir/"+
    encodeURIComponent(origem)+"/"+
    rota.map(e=>encodeURIComponent(e)).join("/");

  const msg=encodeURIComponent("Entregas:\n\n"+itens.join("\n")+"\n\nRota:\n"+link);

  const num=whats.numero.replace(/\D/g,"");

  window.open(`https://wa.me/${num}?text=${msg}`);
};

// INIT
addInput();
loadWhats();
loadList();

</script>

</body>
</html>
